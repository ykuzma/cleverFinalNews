plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'
    id 'org.asciidoctor.jvm.convert' version '2.4.0'
}

group 'by.clevertec'
version '1.0-SNAPSHOT'


repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
}

dependencies {

    compileOnly 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.6.0'
    implementation project(':news-core')
    implementation 'org.liquibase:liquibase-core'

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'by.clevertec:starter-logging-controller:0.0.1'
    implementation 'by.clevertec:starter-controller-advice:0.0.1'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    /*implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'*/
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.2.0'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor'org.mapstruct:mapstruct-processor:1.6.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation "org.testcontainers:postgresql"
    testImplementation 'org.jeasy:easy-random-core:5.0.0'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner:4.2.0'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'

}

test {
    outputs.dir snippetsDir
    finalizedBy jacocoTestReport
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test

}

asciidoctor {

    options doctype: 'book'
    inputs.dir snippetsDir
    dependsOn test
    attributes = [
        'snippets':snippetsDir,
        'source-highlighter': 'highlightjs',
        'imagesdir'         : './images',
        'toc'               : 'left',
        'toclevels'         : 3,
        'numbered'          : '',
        'icons'             : 'font',
        'setanchors'        : '',
        'idprefix'          : '',
        'idseparator'       : '-',
        'docinfo1'          : '',
        'safe-mode-unsafe'  : '',
        'allow-uri-read'    : '',
        linkattrs           : true,
        encoding            : 'utf-8'
    ]
}